paths: 
 /api/users/:
  get: 
    summary: Obtener todos los usuarios
    tags: 
      - Users
    responses: 
    '200':
     description: Usuarios obtenidos correctamente
     content: 
       application/json: 
         schema:
           type: array
           items: 
            $ref: '#/components/schemas/User'
     '500':
      description: Error al obtener usuarios
  
  post:
   summary: Crear un nuevo usuario
   tags:
    - Users
   parameters:
    - name: body
      in: body
      required: true
      schema:
       type: object
       properties:
        first_name:
         type: string
        last_name:
         type: string
        email:
         type: string
        password:
         type: string
   responses:
    '201':
        description: Usuario creado correctamente
        content:
         application/json:
          schema:
           items:
            $ref: '#/components/schemas/User'
    '500':
        description: Error al crear usuario

 /api/users/{id}:
   get: 
     summary: Obtener un usuario
     tags: 
      - Users
     parameters:
      - name: id
        in: path
        required: true
        schema:
         $type: String
        description: Id del usuario a buscar
    responses:
      '200':
        description: Usuario obtenido correctamente
        content:
         application/json:
          schema:
           items:
            $ref: '#/components/schemas/User'
      '404':
        description: Usuario no existe
      '500':
        description: Error al obtener usuario

   put: 
      summary: Actualizar un usuario
      tags: 
      - Users
      parameters:
      -name: id
       in: path
       required: true
       schema:
        $type: String
      description: Id del usuario a actualizar
      -name: body
       required: true
       schema:
        type: object
        properties: 
         first_name:
          type: String
         last_name:
          type: String
         email:
          type: String
         password:
          type: String
      responses:
       '200':
        description: "Usuario actualizado correctamente"
        content:
         application/json: 
          schema:
           items:
            $ref: '#/components/schemas/User'
       '404':
        description: Usuario no encontrado
       '500':
        description: Error al actualizar usuario
      


   delete: 
      summary: Eliminar un usuario
      tags: 
      - Users
      parameters: 
       -name: id
        in: path
        required: true
        schema:
         $type: String
        description: Id del usuario a eliminar
      responses:
       '200':
        description: "Usuario eliminado correctamente"
        content:
         application/json: 
          schema:
           items:
            $ref: '#/components/schemas/User'
       '404':
        description: Usuario no encontrado
       '500':
        description: Error al actualizar usuario

components:
 schemas: 
  User:
   type: object
   properties: 
    _id: 
     type: ObjectId
     description:Id autogenerado por MongoDB
    first_name:
     type: String
     description: Nombre de mi usuario
    last_name:
     type: String
     description: Apellido de mi usuario
    email:
     type: String
     description: Email de mi usuario
    password:
     type: String
     description: Contraseña de mi usuario
  
    example:
     _id: ObjectId('123cc1')
     first_name: Pedro
     last_name: Perez
     email: pedro@perez.com
     password: Pedro12234
